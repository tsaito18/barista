[package]
name = "barista"
version = "0.1.0"
edition = "2021"

[dependencies]
muda = "0.19.3"
tray-icon = "0.24.1"
windows = { version = "0.62.2", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Registry", "Win32_Security"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
